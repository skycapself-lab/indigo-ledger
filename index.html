<title>靛夜記帳本</title>

<style>
/* Layout: one-column phone app — header + week strip, stacked cards, floating add button, slide-in drawer, bottom sheet forms */
:root{
  --bg:#0e0c1d; --surface:#17142c; --surface2:#201c3d; --line:#2d2852; --fg:#ebe8ff; --muted:#9a94c8; --dim:#6c669a;
  --accent:#c3bbf3; --accent-ink:#0e0c1d; --indigo:#5b5fe0;
  --exp:#ff8fa8; --inc:#62d6a9; --warn:#f6b85a;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.exp{color:var(--exp)} .inc{color:var(--inc)} .muted{color:var(--muted)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:56px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bar h1{font-size:19px;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--fg);position:relative}
.ib:active{background:var(--surface2)}
.ib input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;padding:2px max(4px,env(safe-area-inset-left,0px)) 10px max(4px,env(safe-area-inset-right,0px))}
.week .nav{color:var(--dim);height:48px;display:grid;place-items:center}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;color:var(--dim)}
.day b{font-family:var(--f-num);font-size:20px;font-weight:600;line-height:1.1}
.day small{font-size:11px}
.day.has b::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.on.has b::after{background:var(--accent-ink)}
.day.today:not(.on){color:var(--fg)}

main{padding-block:14px 110px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ch h2{font-size:15px;font-weight:500;margin:0;flex:1;color:var(--muted);letter-spacing:.04em}
.ch .i{color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.tag.acc{border-color:transparent;background:#2b2560;color:#cfc8ff}
.tag.card{background:#3a2a5c;color:#e3c9ff}
.tag.bank{background:#232a5c;color:#c4ccff}
.tag.ewallet{background:#1f3a4a;color:#bfe8ff}
.tag.cash{background:#1f3d33;color:#b9f0d8}

.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list>.tx:first-child{border-top:0}
.tx .l{flex:1;min-width:0}
.tx .n{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tx .r{text-align:right;flex:none}
.tx .a{font-size:17px;font-weight:600}
.tx .w{font-size:12px;color:var(--muted)}
.tot{display:flex;justify-content:flex-end;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;color:var(--muted)}
.tot .num{font-size:18px}
.empty{color:var(--muted);text-align:center;padding:22px 0 14px;font-size:14px}
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 0 2px;border-top:1px solid var(--line)}
.list .dh:first-child{border-top:0;padding-top:0}

.meter{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.meter i.warn{background:var(--warn)} .meter i.over{background:var(--exp)}
.bnum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bnum .big{font-size:24px;font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:10px}
.kv:first-of-type{border-top:0}
button.kv{width:100%;text-align:left}
.kv .num{font-size:16px}
.kv .chev{color:var(--dim);display:flex;align-items:center;gap:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface2);border-radius:12px;padding:10px 12px;text-align:left}
.mini small{display:block;color:var(--muted);font-size:12px}
.mini .num{font-size:17px}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 28px #0009;z-index:25}
.fab svg.i{width:28px;height:28px;stroke-width:2.4}

.scrim{position:fixed;inset:0;background:#05040dcc;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,82vw);background:var(--surface);z-index:60;transform:translateX(-102%);transition:transform .22s ease;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 14px) max(10px,env(safe-area-inset-left,0px));overflow-y:auto;border-right:1px solid var(--line)}
.drawer.on{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px 16px;font-weight:700;font-size:18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-num)}
.nv{display:flex;align-items:center;gap:14px;width:100%;padding:12px 12px;border-radius:12px;font-size:16px;color:var(--muted)}
.nv.on{background:var(--surface2);color:var(--fg)} .nv.on .i{color:var(--accent)}
.sep{height:1px;background:var(--line);margin:8px 6px}

.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94%;background:var(--bg);border-radius:20px 20px 0 0;z-index:70;transform:translateY(102%);transition:transform .24s ease;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sheet:not(.on),.drawer:not(.on){visibility:hidden;transition:transform .22s ease,visibility 0s .24s}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-h h3{flex:1;margin:0;font-size:17px}
.sh-b{overflow-y:auto;padding-block:6px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-f{display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.lab{font-size:13px;color:var(--muted);margin:14px 0 7px;letter-spacing:.04em;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px;white-space:nowrap}
.chip small{color:var(--muted);font-size:11px;margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:#4a4380}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:8px 0;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--fg);font-weight:500}
.seg button.on.e{color:var(--exp)} .seg button.on.n{color:var(--inc)}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.in:focus{border-color:var(--accent)}
.amt{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.amt:focus-within{border-color:var(--accent)}
.amt input{flex:1;min-width:0;background:none;border:0;outline:none;font-family:var(--f-num);font-size:30px;font-weight:600;padding:6px 0}
.amt span{color:var(--dim);font-family:var(--f-num)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.btn{flex:1;padding:13px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--fg);font-weight:500}
.btn.danger{background:none;color:var(--exp);border:1px solid #5a2a3f;flex:0 0 auto;padding:13px 16px}
.err{color:var(--exp);font-size:13px;min-height:18px;margin-top:8px}
.addcat{display:flex;gap:8px;margin-top:8px}
.addcat .btn{flex:0 0 auto;padding:10px 16px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:left .18s}
.switch.on{background:var(--accent);border-color:var(--accent)}.switch.on::after{left:25px;background:var(--accent-ink)}
.bigtime input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;font-family:var(--f-num);font-size:44px;font-weight:600;text-align:center;padding:12px;color:var(--fg);margin-top:6px}
.npv{background:#f4f2fb;color:#1d1a2e;border-radius:16px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.npv-h{display:flex;align-items:center;gap:6px;font-size:12px;color:#6a6585}
.npv-h i{width:18px;height:18px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:11px;font-weight:600}
.npv b{font-size:15px}
.npv-a{color:#5b4fc4;font-weight:700;font-size:13px;margin-top:6px}
.dlg{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:#05040dcc;padding:20px}
.dlg .card{max-width:340px;width:100%}
.dlg p{margin:4px 0 16px}
.dlg .acts{display:flex;gap:10px}

.note{background:#251f4a;border:1px solid #3b3374;color:#d6d0ff;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.note button{color:var(--accent);font-weight:700;white-space:nowrap}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-size:17px}
.legend{display:flex;flex-direction:column}
.lg{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.lg:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.lg .nm{flex:1}
.lg .pc{color:var(--muted);font-size:13px;width:48px;text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut svg{width:190px;max-width:100%}
textarea.in{min-height:140px;font-family:var(--f-num);font-size:12px;resize:vertical}
.help{color:var(--muted);font-size:13px;margin:6px 0 0}
.help ol{padding-left:20px;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(()=>{

const PAL=['#c3bbf3','#ff8fa8','#62d6a9','#f6b85a','#6fb8ff','#d58cff','#ff9f6b','#9be06a','#5ad0d6','#c9c3f0'];

  if(t.type==='expense'&&t.acc===id)b-=v;else if(t.type==='income'&&t.acc===id)b+=v;else if(t.type==='transfer'){if(t.acc===id)b-=v;if(t.toAcc===id)b+=v}}return b}
function lastClose(day){const r=new Date();let y=r.getFullYear(),m=r.getMonth();const dim=(y,m)=>new Date(y,m+1,0).getDate();
  let d=Math.min(day,dim(y,m));if(r.getDate()<d){m--;if(m<0){m=11;y--}d=Math.min(day,dim(y,m))}return ymd(new Date(y,m,d))}
function cardInfo(a){const lc=lastClose(a.closeDay||1);const owedAtClose=-balance(a.id,lc);let paid=0,neu=0;
  for(const t of S.tx){if(t.date<=lc)continue;const v=+t.amount;
    if((t.type==='transfer'&&t.toAcc===a.id)||(t.type==='income'&&t.acc===a.id))paid+=v;
    if((t.type==='expense'||t.type==='transfer')&&t.acc===a.id)neu+=v}
  return {lc,pending:Math.max(0,owedAtClose-paid),neu,total:-balance(a.id)}}

      return `<rect x="${x+bw*.15}" y="${bot-hN}" width="${bw*.32}" height="${hN}" rx="3" fill="var(--inc)"/><rect x="${x+bw*.5}" y="${bot-hE}" width="${bw*.32}" height="${hE}" rx="3" fill="var(--exp)"/><text x="${x+bw/2}" y="${bot+14}" text-anchor="middle">${+d.k.slice(5)}月</text>`}).join('');
    const cur=data[5];
    body=`<section class="card"><div class="grid4"><div class="mini"><small>本月收入</small><span class="num inc">${money(cur.n)}</span></div><div class="mini"><small>本月支出</small><span class="num exp">${money(cur.e)}</span></div></div>
      <div class="kv" style="margin-top:8px"><span>結餘</span><span class="num ${cur.n-cur.e<0?'exp':'inc'}" style="font-size:18px">${money(cur.n-cur.e)}</span></div></section>
      <section class="card"><div class="ch">${ic('chart')}<h2>近六個月收支</h2><span class="muted" style="font-size:12px"><span class="dot" style="display:inline-block;background:var(--inc)"></span> 收入　<span class="dot" style="display:inline-block;background:var(--exp)"></span> 支出</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近六個月收支長條圖"><line x1="8" x2="${W-4}" y1="${bot}" y2="${bot}" stroke="var(--line)"/><line x1="8" x2="${W-4}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="8" y="${top-4}">${money(mx)}</text>${bars}</svg></section>`;
  } else {
    const list=S.tx.filter(t=>t.type===V.st&&t.date.startsWith(ym));const total=list.reduce((s,t)=>s+ +t.amount,0);
    const by={};list.forEach(t=>by[t.cat||'其他']=(by[t.cat||'其他']||0)+ +t.amount);const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    const R=62,C=2*Math.PI*R;let off=0;
    const segs=ent.map(([c,v],i)=>{const len=C*v/total;const s=`<circle cx="95" cy="95" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="24" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 95 95)"/>`;off+=len;return s}).join('');
    const daily=Array(dim).fill(0);list.forEach(t=>daily[+t.date.slice(8)-1]+=+t.amount);const mx=Math.max(1,...daily);
    const W=320,H=150,bot=128,top=14,bw=(W-16)/dim;const col=V.st==='expense'?'var(--exp)':'var(--inc)';
    const bars=daily.map((v,i)=>v?`<rect x="${10+i*bw+bw*.15}" y="${bot-(bot-top)*v/mx}" width="${bw*.7}" height="${(bot-top)*v/mx}" rx="1.5" fill="${col}"/>`:'').join('');
    const ticks=[1,10,20,dim].map(d=>`<text x="${10+(d-.5)*bw}" y="${bot+14}" text-anchor="middle">${d}</text>`).join('');
    body=total?`<section class="card"><div class="donut"><svg viewBox="0 0 190 190" role="img" aria-label="類別比例圓餅圖"><circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="24"/>${segs}
      <text x="95" y="88" text-anchor="middle" fill="var(--muted)" font-size="12" font-family="var(--f-body)">${V.st==='expense'?'總支出':'總收入'}</text><text x="95" y="110" text-anchor="middle" fill="var(--fg)" font-size="19" font-weight="600" font-family="var(--f-num)">${money(total)}</text></svg></div>
      <div class="legend" style="margin-top:8px">${ent.map(([c,v],i)=>`<div class="lg"><span class="dot" style="background:${PAL[i%PAL.length]}"></span><span class="nm">${esc(c)}</span><span class="num">${money(v)}</span><span class="pc num">${(v/total*100).toFixed(1)}%</span></div>`).join('')}</div></section>
      <section class="card"><div class="ch">${ic('chart')}<h2>每日${V.st==='expense'?'支出':'收入'}</h2></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每日長條圖"><line x1="8" x2="${W-4}" y1="${bot}" y2="${bot}" stroke="var(--line)"/><line x1="8" x2="${W-4}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="8" y="${top-4}">${money(mx)}</text>${bars}${ticks}</svg></section>`
      :`<section class="card empty">這個月沒有${V.st==='expense'?'支出':'收入'}紀錄</section>`}
  return {top:header('統計圖'),main:mnav+seg+body,fab:true}}

function vSettings(){return {top:header('備份與設定'),main:`<section class="card"><div class="ch">${ic('gear')}<h2>資料備份</h2></div>
  <p class="help" style="margin-top:0">所有紀錄只存在這支手機的這個瀏覽器裡。清除瀏覽器資料或換手機前，請先匯出備份。</p>

  <section class="card"><div class="ch"><h2>重設</h2></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger" data-act="resetAll">刪除全部資料</button><button class="btn ghost" data-act="loadSample">載入範例資料</button></div></section>`,fab:false}}

function notifNote(){if(!canNotify())return `<div class="note"><span style="flex:1">這裡是預覽版，瀏覽器不允許傳送通知。設定會保留，請用安裝到主畫面的版本開啟。</span></div>`;
  if(perm()==='denied')return `<div class="note"><span style="flex:1">通知權限被封鎖了。請到手機「設定 → 應用程式 → 靛夜記帳本（或 Chrome）→ 通知」開啟。</span></div>`;return ''}
const permLabel=p=>({granted:'<span class="inc">已允許</span>',denied:'<span class="exp">已封鎖</span>',default:'<span class="muted">尚未允許</span>'}[p]||'<span class="muted">不支援</span>');
const bgLabel=()=>({ok:'已啟用，約每小時檢查一次',denied:'需安裝到主畫面才能啟用',unsupported:'此瀏覽器不支援，App 開著時才會提醒',preview:'預覽版不支援'}[V.bg]||'檢查中…');
function vRemind(){const R=S.reminder,p=perm();
  return {top:header('提醒'),main:`${notifNote()}
  <section class="card"><div class="kv"><span style="font-size:17px">每日記帳提醒</span><button class="switch ${R.on?'on':''}" role="switch" aria-checked="${R.on}" aria-label="每日記帳提醒" data-act="remOn"></button></div>
    <label class="bigtime"><input type="time" id="remTime" value="${R.time}" aria-label="提醒時間"></label>
    <div class="lab">略過條件</div><div class="chips wrap">${[['always','每天都提醒'],['opened','當日有開啟則不提醒'],['recorded','當日有記帳則不提醒']].map(([k,l])=>`<button class="chip ${R.mode===k?'on':''}" data-act="remMode" data-arg="${k}">${l}</button>`).join('')}</div></section>
  <section class="card"><div class="ch">${ic('bell')}<h2>通知狀態</h2></div>
    <div class="kv"><span>通知權限</span><span>${permLabel(p)}</span></div><div class="kv"><span>背景提醒</span><span class="muted" style="text-align:right">${bgLabel()}</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">${canNotify()&&p==='default'?'<button class="btn" data-act="askPerm">允許傳送通知</button>':''}<button class="btn ghost" data-act="testRemind">傳送測試通知</button></div></section>
  <section class="card"><div class="ch">${ic('cal')}<h2>要準時，可加到手機行事曆</h2></div>
    <p class="help" style="margin-top:0">網頁 App 在背景的檢查時間由 Android 安排，提醒可能晚幾十分鐘出現。想準時，可以把每天 ${R.time} 的提醒加進行事曆；行事曆不會判斷你當天有沒有記帳。</p>
    <div style="display:flex;margin-top:10px"><button class="btn ghost" data-act="ics">加到行事曆（.ics）</button></div></section>`,fab:false,
  after:()=>{const t=$('#remTime');t.addEventListener('change',()=>{if(!t.value)return;S.reminder.time=t.value;save();setReminded('');toast('提醒時間 '+t.value)})}}}
function vStatus(){const st=S.status,lines=statusLines();
  return {top:header('通知欄顯示'),main:`${notifNote()}
  <section class="card"><div class="kv"><span style="font-size:17px">在通知欄顯示記帳摘要</span><button class="switch ${st.on?'on':''}" role="switch" aria-checked="${st.on}" aria-label="通知欄顯示" data-act="stOn"></button></div>

  <section class="card"><div class="ch"><h2>預覽</h2></div><div class="npv"><div class="npv-h"><i>$</i>靛夜記帳本 · 現在</div><b>靛夜記帳本</b><div>${esc(lines.join('　·　')||'點此記一筆')}</div><div class="npv-a">記一筆</div></div></section>
  <section class="card"><div class="lab" style="margin-top:0">顯示內容</div><div class="chips wrap">${[['today','今日支出'],['month','本月已支出'],['budget','本月預算剩餘'],['card','信用卡待繳']].map(([k,l])=>`<button class="chip ${st.lines.includes(k)?'on':''}" data-act="stLine" data-arg="${k}">${l}</button>`).join('')}</div></section>`,fab:false}}

/* ---------- sheets ---------- */

function closeAll(){$('#sheet').classList.remove('on');$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');F=null}

function txForm(){const f=F,isT=f.type==='transfer';
  const accChips=(key)=>['card','cash','bank','ewallet'].map(ty=>S.accounts.filter(a=>a.type===ty).map(a=>`<button class="chip ${f[key]===a.id?'on':''}" data-act="f" data-arg="${key}|${a.id}">${esc(a.name)}<small>${TYPES[ty]}</small></button>`).join('')).join('');
  const cats=f.type==='income'?S.cats.income:S.cats.expense;
  const names=[...new Set(S.tx.filter(t=>t.cat===f.cat&&t.name).map(t=>t.name).reverse())].slice(0,15);
  const title=f.mode==='sched'?(f.sid?'編輯排程':'新增排程'):(f.id?'編輯紀錄':'記一筆');
  return `<div class="sh-h"><h3>${title}</h3><button class="ib" data-act="closeAll" aria-label="關閉">${ic('x')}</button></div>
  <div class="sh-b">
    <div class="seg" style="margin-top:8px">${[['expense','支出','e'],['income','收入','n'],['transfer','轉帳','']].map(([k,l,c])=>`<button class="${f.type===k?'on '+c:''}" data-act="f" data-arg="type|${k}">${l}</button>`).join('')}</div>
    <div class="lab">金額</div><div class="amt"><span>$</span><input id="f_amount" data-f="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${f.amount??''}" aria-label="金額"><span>TWD</span></div>

    ${isT?`<div class="lab">轉入帳戶（繳卡費選信用卡）</div><div class="chips">${accChips('toAcc')}</div>`:`
    <div class="lab">類別</div><div class="chips"><button class="chip" data-act="toggleAddCat" aria-label="新增類別">＋</button>${cats.map(c=>`<button class="chip ${f.cat===c?'on':''}" data-act="f" data-arg="cat|${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="addcat" id="addCat" hidden><input class="in" id="newCat" placeholder="新類別名稱" maxlength="8"><button class="btn" data-act="addCat">加入</button></div>`}
    <div class="lab">項目名稱</div><input class="in" id="f_name" data-f="name" list="nameList" placeholder="${isT?'例如：繳卡費':'例如：午餐'}" value="${esc(f.name)}"><datalist id="nameList">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div class="lab">備註</div><input class="in" id="f_note" data-f="note" placeholder="選填" value="${esc(f.note)}">
    <div class="row2">${f.mode==='sched'?`<div><div class="lab">每月幾日</div><input class="in" id="f_day" data-f="day" type="number" min="1" max="31" inputmode="numeric" value="${f.day}"></div>`:`<div><div class="lab">日期</div><input class="in" id="f_date" data-f="date" type="date" value="${f.date}"></div>`}
    <div><div class="lab">&nbsp;</div>${f.type==='expense'?`<label class="check"><input type="checkbox" id="f_nb" data-f="noBudget" ${f.noBudget?'checked':''}>不列入預算</label>`:''}</div></div>

  ${F.type==='card'?`<div class="lab">每月結帳日</div><input class="in" id="a_close" type="number" min="1" max="31" inputmode="numeric" value="${a?.closeDay||1}">`:''}
  <div class="err" id="ferr"></div></div><div class="sh-f">${a?`<button class="btn danger" data-act="delAcc">刪除</button>`:''}<button class="btn" data-act="saveAcc">儲存</button></div>`)}

/* ---------- actions ---------- */
const ACT={
  async askPerm(){if(!canNotify())return toast('預覽版無法傳送通知，請用安裝版');try{await Notification.requestPermission()}catch(e){}await regPeriodic();syncSW();render()},
  async remOn(){S.reminder.on=!S.reminder.on;save();if(S.reminder.on&&canNotify()&&perm()==='default')await ACT.askPerm();await regPeriodic();render();toast(S.reminder.on?`每天 ${S.reminder.time} 提醒`:'已關閉提醒')},
  remMode(k){S.reminder.mode=k;save();render()},
  testRemind(){notifyRemind(true)},
  async stOn(){S.status.on=!S.status.on;save();if(S.status.on){if(canNotify()&&perm()==='default')await ACT.askPerm();showStatus().catch(()=>{})}else hideStatus();await regPeriodic();render()},
  stLine(k){const L=S.status.lines;S.status.lines=L.includes(k)?L.filter(x=>x!==k):[...L,k];save();render()},
  ics(){const[h,m]=S.reminder.time.split(':');const d=today().replace(/-/g,''),st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Indigo Ledger//ZH-TW','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:ledger-${uid()}@indigo-ledger`,`DTSTAMP:${st}`,`DTSTART:${d}T${h}${m}00`,'DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:記帳時間','DESCRIPTION:打開靛夜記帳本，記下今天的花費','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:記帳時間','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    if(!PWA)return toast('預覽版無法下載，請用安裝版');
    try{const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const a=document.createElement('a');a.href=u;a.download='記帳提醒.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('已下載，點開檔案加入行事曆')}catch(e){toast('下載失敗')}},
  drawer(){$('#drawer').classList.add('on');$('#scrim').classList.add('on')},
  closeAll,
  go(v){closeAll();V.view=v;window.scrollTo(0,0);render()},
  pick(d){V.sel=d;render()},
  wk(n){const d=pd(V.sel);d.setDate(d.getDate()+ +n);V.sel=ymd(d);render()},
  accTx(id){V.acc=id;V.view='acctx';window.scrollTo(0,0);render()},
  st(k){V.st=k;render()},
  sm(n){const d=pd(V.sm+'-01');d.setMonth(d.getMonth()+ +n);V.sm=ymd(d).slice(0,7);render()},
  newTx(){F=newF();if(V.view==='acctx')F.acc=V.acc;else if(TYPES[V.view]){const a=S.accounts.find(x=>x.type===V.view);if(a)F.acc=a.id}showForm();setTimeout(()=>$('#f_amount')?.focus(),260)},
  editTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;F={...newF(),...t,mode:'tx'};showForm()},
  newSched(){F=newF({mode:'sched'});showForm()},
  editSched(id){const s=S.schedules.find(x=>x.id===id);if(!s)return;F={...newF(),...s.tpl,mode:'sched',sid:s.id,day:s.day};showForm()},
  f(arg){const i=arg.indexOf('|'),k=arg.slice(0,i),v=arg.slice(i+1);
    if(k==='type'){F.type=v;if(v==='income')F.cat=S.cats.income.includes(F.cat)?F.cat:S.cats.income[0];if(v==='expense')F.cat=S.cats.expense.includes(F.cat)?F.cat:S.cats.expense[0];if(v!=='expense')F.noBudget=false}
    else F[k]=v;const sc=$('.sh-b')?.scrollTop;showForm();if(sc)$('.sh-b').scrollTop=sc},
  toggleAddCat(){const b=$('#addCat');b.hidden=!b.hidden;if(!b.hidden)$('#newCat').focus()},
  addCat(){const v=$('#newCat').value.trim();if(!v)return;const k=F.type==='income'?'income':'expense';if(!S.cats[k].includes(v))S.cats[k].push(v);F.cat=v;save();showForm()},
  saveF(){const f=F,amt=Math.round(parseFloat(f.amount)*100)/100,err=$('#ferr');
    if(!(amt>0))return err.textContent='請輸入大於 0 的金額';
    if(!acc(f.acc))return err.textContent='請選擇帳戶';
    if(f.type==='transfer'&&(!acc(f.toAcc)||f.toAcc===f.acc))return err.textContent='請選擇不同的轉入帳戶';
    const rec={type:f.type,acc:f.acc,toAcc:f.type==='transfer'?f.toAcc:undefined,cat:f.type==='transfer'?'':f.cat,name:(f.name||'').trim(),note:(f.note||'').trim(),noBudget:f.type==='expense'&&!!f.noBudget,amount:amt};
    if(f.mode==='sched'){const day=Math.min(31,Math.max(1,parseInt(f.day)||1));
      if(f.sid){const s=S.schedules.find(x=>x.id===f.sid);s.day=day;s.tpl=rec}
      else{const n=new Date(),ym=today().slice(0,7);const prev=ymd(new Date(n.getFullYear(),n.getMonth()-1,1)).slice(0,7);
        S.schedules.push({id:uid(),day,tpl:rec,lastRun:n.getDate()>=day?ym:prev})}
      save();closeAll();render();return toast('排程已儲存')}
    if(!/^\d{4}-\d\d-\d\d$/.test(f.date||''))return err.textContent='請選擇日期';
    if(f.id){Object.assign(S.tx.find(x=>x.id===f.id),rec,{date:f.date})}else{S.tx.push({id:uid(),created:Date.now(),date:f.date,...rec});S.lastEntryDay=today()}
    save();closeAll();if(V.view==='home')V.sel=f.date;render();toast(f.id?'已更新':'已記下 '+money(amt))},
  async delF(){const f=F;if(!await ask(f.mode==='sched'?'刪除這個排程？已記入的紀錄會保留。':'刪除這筆紀錄？','刪除'))return;
    if(f.mode==='sched')S.schedules=S.schedules.filter(s=>s.id!==f.sid);else S.tx=S.tx.filter(t=>t.id!==f.id);save();closeAll();render();toast('已刪除')},
  newAcc(type){accForm(null,type)},
  editAcc(id){accForm(acc(id))},
  saveAcc(){const name=$('#a_name').value.trim();if(!name)return $('#ferr').textContent='請輸入名稱';
    let init=parseFloat($('#a_init').value)||0;if(F.type==='card')init=-init;const closeDay=F.type==='card'?Math.min(31,Math.max(1,parseInt($('#a_close').value)||1)):undefined;
    if(F.id)Object.assign(acc(F.id),{name,init,closeDay});else S.accounts.push({id:uid(),name,type:F.type,init,closeDay});save();closeAll();render();toast('帳戶已儲存')},
  async delAcc(){const id=F.id,n=S.tx.filter(t=>t.acc===id||t.toAcc===id).length;
    if(!await ask(n?`這個帳戶有 ${n} 筆紀錄，刪除帳戶會一併刪除這些紀錄。確定？`:'刪除這個帳戶？','刪除'))return;
    S.tx=S.tx.filter(t=>t.acc!==id&&t.toAcc!==id);S.schedules=S.schedules.filter(s=>s.tpl.acc!==id&&s.tpl.toAcc!==id);S.accounts=S.accounts.filter(a=>a.id!==id);save();closeAll();render();toast('帳戶已刪除')},
  saveBud(){S.budget=Math.max(0,parseFloat($('#budIn').value)||0);save();render();toast('預算已更新')},
  async clearSample(){if(!await ask('清空所有收支紀錄與排程？帳戶名稱、結帳日與類別會保留，帳戶起始金額歸零。','清空'))return;
    S.tx=[];S.schedules=[];S.accounts.forEach(a=>a.init=0);S.sample=false;save();render();toast('已清空，可以開始記帳了')},
  async resetAll(){if(!await ask('刪除全部帳戶、紀錄與設定？這個動作無法復原，建議先匯出備份。','全部刪除'))return;
    S={v:1,sample:false,accounts:[{id:uid(),name:'現金',type:'cash',init:0}],tx:[],cats:seed().cats,budget:30000,schedules:[]};norm();save();V.view='home';render();toast('已重設')},
  async loadSample(){if(!await ask('用範例資料取代目前所有資料？','載入',false))return;S=seed();norm();save();V.view='home';render()},
  delCat(arg){const[k,c]=arg.split('|');if(S.cats[k].length<=1)return toast('至少保留一個類別');S.cats[k]=S.cats[k].filter(x=>x!==c);save();render()},
  export(){const json=JSON.stringify(S);const name=`記帳備份-${today()}.json`;
    try{const b=new Blob([json],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){}
    openSheet(`<div class="sh-h"><h3>匯出備份</h3><button class="ib" data-act="closeAll" aria-label="關閉">${ic('x')}</button></div><div class="sh-b">
      <p class="help">已嘗試下載「${esc(name)}」。若沒有出現下載，請複製下方內容存到記事本或雲端硬碟。</p><textarea class="in" id="expOut" readonly>${esc(json)}</textarea></div>
      <div class="sh-f"><button class="btn" data-act="copyExp">複製備份內容</button></div>`)},
  copyExp(){const t=$('#expOut');const fb=()=>{t.focus();t.select();toast('已全選，請長按複製')};
    try{navigator.clipboard.writeText(t.value).then(()=>toast('已複製'),fb)}catch(e){fb()}},
  import(){$('#fileIn').click()},
  importPaste(){doImport($('#pasteIn').value)}
};
async function doImport(txt){let d;try{d=JSON.parse(txt)}catch(e){return toast('內容不是有效的備份格式')}
  if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.tx))return toast('找不到帳戶或紀錄資料');
  if(!await ask(`匯入 ${d.accounts.length} 個帳戶、${d.tx.length} 筆紀錄，並取代目前資料？`,'匯入',false))return;
  d.cats??=seed().cats;d.schedules??=[];d.budget??=30000;S=d;norm();save();V.view='home';render();toast('匯入完成')}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);e.target.value=''});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(a){e.preventDefault();a(el.dataset.arg,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
/* swipe week on home */
let sx=null;document.addEventListener('touchstart',e=>{if(e.target.closest('.week'))sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)ACT.wk(dx<0?7:-7)},{passive:true});

runSchedules();render();syncSW();
if(location.hash==='#add'){try{history.replaceState(null,'',location.pathname)}catch(e){}setTimeout(()=>ACT.newTx(),300)}
try{navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='add')ACT.newTx()})}catch(e){}
regPeriodic().then(()=>{if(V.view==='remind')render()});
checkReminder();setInterval(checkReminder,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminder();syncSW()}});
/* PWA: register service worker when hosted as an app */
try{if('serviceWorker' in navigator&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>

</body></html>
